[workspace]
members = [
  "hyperdu-core",
  "hyperdu",
  "hyperdu-gui",
]
resolver = "2"

# Every crate inherits these with `<key>.workspace = true`, so a release bumps
# the package version below and the matching core dependency pin. Previously, metadata that
# goes with it were repeated in four manifests, and the hyperdu-core dependency
# pin in three of them, which is how a bump missed Cargo.lock once already.
#
# `rust-version` is deliberately not here. The hyperdu CLI includes the MCP
# server and needs 1.88 for rmcp, while the core and GUI keep their own floors.
[workspace.package]
version = "0.5.0-beta.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/automationjp/HyperDiskUsage"
homepage = "https://github.com/automationjp/HyperDiskUsage#readme"
# `cargo wix init` / `cargo wix print` refuse to generate a WiX source without
# this field, and neither `--manufacturer` nor `--owner` substitutes for it --
# both are applied after the manifest is read, so the read fails first. The MSI
# build itself (`cargo wix`) does not read it; the field stays so the checked-in
# wix/main.wxs can be regenerated. The value matches the winget publisher in
# scripts/package/winget.ps1 so the two Windows package managers name the same
# entity. Only the two crates that ship an MSI opt in (hyperdu and hyperdu-gui);
# hyperdu-core deliberately does not inherit it.
authors = ["automationjp"]

[workspace.dependencies]
# The `version` here must match `workspace.package.version`: cargo publish
# rewrites the path dependency into a registry one and needs a version to do
# it. Publish hyperdu-core first, then the two binaries that depend on it.
hyperdu-core = { path = "hyperdu-core", version = "0.5.0-beta.3" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
debug = true
incremental = false
