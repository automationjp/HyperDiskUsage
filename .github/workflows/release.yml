name: release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v*.*.*'
  # Inherited from windows-msi.yml, which is gone: it ran this same
  # scripts/package/release.ps1 on every tag and uploaded a second copy of the
  # artifacts the `windows` job below already produces. A manual run here builds
  # without publishing. Only tag runs can enter the privileged publish job.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      # cargo-deb was compiled from source on every tag, inside a step that took
      # 2m48s. install-action fetches a prebuilt binary instead. cargo-wix and
      # cargo-generate-rpm cannot follow: neither publishes release binaries
      # (checked at 0.3.9 and v0.21.0) and install-action carries no manifest
      # for either, so they stay source builds -- here and in the windows job.
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: cargo-deb
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu mingw-w64 zip jq rpm
          cargo install cargo-generate-rpm || true
      - name: Lint (fmt + clippy)
        run: bash scripts/lint/run.sh
      - name: Package ZIP/DEB/RPM/AppImage (CLI+GUI)
        # linuxdeploy and appimagetool are themselves AppImages, and an AppImage
        # self-mounts through libfuse2, which the runner image no longer carries.
        # Extracting instead is the supported way out and costs a temp directory.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          # Build Linux targets only here; Windows artifacts are built on the Windows runner to avoid duplicates.
          #
          # AppImage is optional. Only independently verified local tools are used;
          # absent/invalid tools produce a warning and an archived diagnostic log.
          bash scripts/package/release.sh --targets "linux-gnu,linux-musl,linux-aarch64,linux-appimage" \
            --cpu-flavors "generic" --deb --rpm --verbose
      - name: Generate Snap/Flatpak manifests
        run: |
          bash scripts/package/snap.sh --generate-only
          bash scripts/package/flatpak.sh --generate-only
      # snapcraft pushes the whole project into its build instance, and by this
      # point target/ holds three cross-compiled release trees. Nothing after
      # this reads it: the zips, deb, rpm and AppImage are already in dist/.
      - name: Drop the build tree before the snap build
        run: rm -rf target
      - name: Build Snap (CLI) via Snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        with:
          # The repository root, not snap/. `path` names the project directory,
          # and pointing it at snap/ made the part's `source: .` resolve there
          # too, so every release died with "could not find Cargo.toml in
          # /root/parts/hyperdu/build" while the job stayed green.
          path: .
        continue-on-error: true
      - name: Move Snap artifacts to dist
        run: |
          mkdir -p dist
          mv ./*.snap dist/ 2>/dev/null || true
        continue-on-error: true
      # No flatpak build step. The manifest is still generated above, because it
      # is useful to a downstream packager, but building it here has never
      # produced a bundle: the runner has no flatpak-builder
      # ("/usr/bin/xvfb-run: flatpak-builder: not found"), and past that the
      # manifest would still need the rust SDK extension and a vendored crate
      # tree, since flatpak-builder builds with the network switched off. That
      # is a packaging task of its own. A step that cannot succeed is worse than
      # no step, because continue-on-error turns it into silence.
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-artifacts
          path: |
            dist/*
            snap/snapcraft.yaml
            packaging/flatpak/org.hyperdu.GUI.yaml
      # --verbose writes dist/build_*.log. They are useful for debugging a failed
      # release, so they stay in the actions artifact uploaded above, but the
      # v0.0.1 draft proved they otherwise ship as public release assets.
      - name: Drop build logs from release assets
        run: rm -f dist/*.log
      # Runs after the log sweep, so it describes exactly what the release will
      # carry. Every packager above is allowed to fail, which is how a snap that
      # had not built since 0.4.0 and an rpm that never built at all both went
      # unnoticed: the job was green and the release simply had fewer files in
      # it. The tolerance stays -- these are optional formats -- but the outcome
      # is now recorded instead of inferred from the releases page.
      - name: Report packaged artifacts
        run: |
          bash scripts/package/report_artifacts.sh \
            --required 'hyperdu-linux-x86_64-generic.zip' \
            --required 'hyperdu-gui-linux-x86_64-generic.zip' \
            --required 'hyperdu_*.deb' \
            --required 'hyperdu-gui_*.deb' \
            --optional '*.rpm' \
            --optional '*.snap' \
            --optional '*.AppImage'
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Install packagers
        shell: powershell
        run: |
          cargo install cargo-wix
          choco install gh -y
      - name: Lint (fmt + clippy)
        shell: bash
        run: bash scripts/lint/run.sh
      - name: Package (ZIP/EXE/MSI)
        shell: powershell
        run: |
          pwsh -File scripts/package/release.ps1
      - name: Generate Scoop & winget manifests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # cargo resolves the version, not a regex over the manifest: the crate
          # inherits `version.workspace = true`, so the literal is not in
          # hyperdu/Cargo.toml any more. pkgid prints `<url>#<version>`.
          $ver = (cargo pkgid -p hyperdu) -replace '^.*[#@]', ''
          if (-not $ver) { throw 'cargo pkgid returned no version for hyperdu' }
          $tag = "$env:GITHUB_REF_NAME"
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"

          function Get-Asset($pattern) {
            $a = Get-ChildItem $pattern -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $a) { throw "no release asset matched $pattern" }
            [pscustomobject]@{
              Url  = "$base/$($a.Name)"
              Hash = (Get-FileHash -Algorithm SHA256 $a.FullName).Hash.ToLower()
            }
          }

          # Different assets on purpose. winget installs the bare executable as
          # a `portable` package; Scoop extracts the zip and resolves `bin`
          # inside it, which keeps the shim name stable.
          $exe = Get-Asset 'dist\hyperdu-windows-*.exe'
          $zip = Get-Asset 'dist\hyperdu-windows-*.zip'

          pwsh -File scripts/package/winget.ps1 -Version $ver `
            -InstallerUrl $exe.Url -InstallerSha256 $exe.Hash
          pwsh -File scripts/package/scoop.ps1 -Version $ver `
            -Url $zip.Url -Sha256 $zip.Hash

          Write-Host "winget manifests:"
          Get-ChildItem dist\winget | ForEach-Object { Write-Host "  $($_.Name)" }
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-artifacts
          path: |
            dist/*

  # Only immutable same-run artifacts cross this boundary. Never execute them.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-artifacts
          path: assets/linux
      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-artifacts
          path: assets/windows
      - name: Collect release files (data only)
        run: |
          mkdir release-assets
          # Linux artifact paths retain dist/ because manifests share their root;
          # Windows has a single dist/* root and is flattened by upload-artifact.
          find assets/linux/dist assets/windows -maxdepth 1 -type f ! -name '*.log' -exec cp -- {} release-assets/ \;
      - name: Create draft with all assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-assets/*
      - name: Publish the complete draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false -R "$GITHUB_REPOSITORY"

  scoop-pr:
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download Windows manifests (data only)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-artifacts
          path: dist
      - name: Open PR to Scoop bucket
        env:
          GH_TOKEN: ${{ secrets.SCOOP_GH_TOKEN }}
          BUCKET_REPO: ${{ secrets.SCOOP_BUCKET_REPO }}
        shell: powershell
        continue-on-error: true
        run: |
          if (-not $env:BUCKET_REPO -or -not $env:GH_TOKEN) {
            Write-Host "::warning::Scoop secrets not set; skipping PR creation."
            exit 0
          }
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          gh repo clone "$env:BUCKET_REPO" bucketrepo
          Set-Location bucketrepo
          $BR = "update-hyperdu-$env:GITHUB_REF_NAME"
          git checkout -b $BR
          New-Item -ItemType Directory -Path bucket -Force | Out-Null
          Copy-Item ..\dist\scoop\hyperdu.json bucket\hyperdu.json -Force
          git add bucket\hyperdu.json
          git commit -m "hyperdu $env:GITHUB_REF_NAME"
          git push -u origin $BR
          gh pr create -R "$env:BUCKET_REPO" -t "hyperdu $env:GITHUB_REF_NAME" -b "Automated scoop manifest update" -B main

  winget-pr:
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download Windows manifests (data only)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-artifacts
          path: dist
      - name: Open PR to winget-pkgs
        env:
          GH_TOKEN: ${{ secrets.WINGET_GH_TOKEN }}
          WINGET_REPO: ${{ secrets.WINGET_PKGS_REPO }}
        shell: powershell
        continue-on-error: true
        run: |
          if (-not $env:WINGET_REPO -or -not $env:GH_TOKEN) {
            Write-Host "::warning::winget secrets not set; skipping PR creation."
            exit 0
          }
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          gh repo clone "$env:WINGET_REPO" wingetpkgs
          Set-Location wingetpkgs
          $BR = "add-hyperdu-$env:GITHUB_REF_NAME"
          git checkout -b $BR
          # Create folder structure manifests/Y/YourOrg/HyperDU/<version>/
          $org = ($env:GITHUB_REPOSITORY.Split('/'))[0]
          $ver = "$env:GITHUB_REF_NAME".TrimStart('v')
          $base = Join-Path 'manifests' ($org.Substring(0,1).ToUpper())
          $dir = Join-Path $base "$org\HyperDU\$ver"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          # winget.ps1 emits the three-file ManifestVersion 1.12.0 set
          # (version / installer / locale), all named $org.HyperDU*.yaml.
          # The single manifest.yaml this used to copy has not existed since
          # that rewrite, so copy whatever the generator actually produced.
          Copy-Item ..\dist\winget\*.yaml $dir -Force
          git add .
          git commit -m "Add HyperDU $ver"
          git push -u origin $BR
          gh pr create -R "$env:WINGET_REPO" -t "Add HyperDU $ver" -b "Automated manifest" -B master
