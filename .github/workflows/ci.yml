name: ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Lint (fmt + clippy)
        run: bash scripts/lint.sh
      - name: Shellcheck scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S error -x scripts/*.sh
      - name: Import sort (nightly strict)
        run: |
          rustup toolchain install nightly -c rustfmt
          cargo +nightly fmt --all -- --check --config group_imports=StdExternalCrate --config imports_granularity=Crate
      - name: Build
        run: cargo build --workspace --release
      - name: Test core
        run: cargo test -p hyperdu-core -- --nocapture
      # The io_uring backend sits behind a non-default feature, so none of the
      # steps above compile it and it can rot unnoticed. Not `--all-features`:
      # that also pulls in the Tracy profiler, whose build needs a C++ toolchain
      # the runner does not have.
      - name: Lint and test the io_uring backend
        run: |
          cargo clippy -p hyperdu-core --features uring --all-targets -- -D warnings
          cargo test -p hyperdu-core --features uring
          cargo build -p hyperdu-cli --features uring

  # The Windows enumeration backend and its tests are cfg(windows), so the Linux
  # job compiles neither. Run them where they apply.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test core and CLI
        run: cargo test -p hyperdu-core -p hyperdu-cli -- --nocapture

  # Note: artifact packaging is handled in release.yml on tags. CI only builds and tests.
