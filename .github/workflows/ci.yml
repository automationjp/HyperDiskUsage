name: ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  # Release-profile CI checks compilation, not the final packaging LTO budget.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
      # Registry only: target caching would shadow sccache with coarser keys.
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-targets: "false"
      - name: Lint (fmt + clippy)
        run: bash scripts/lint/run.sh
      - name: Shellcheck scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          shellcheck -S error -x scripts/**/*.sh
      - name: Supply-chain and maintenance regression tests (offline mocks)
        run: |
          python3 scripts/package/test_supply_chain.py
          python3 scripts/package/test_registry.py
          python3 scripts/lint/test_maintenance.py
      - name: Import sort (nightly strict)
        run: |
          rustup toolchain install nightly -c rustfmt
          cargo +nightly fmt --all -- --check --config group_imports=StdExternalCrate --config imports_granularity=Crate
      - name: Build
        run: cargo build --workspace --release --locked
      - name: Test core, CLI and GUI
        run: cargo test -p hyperdu-core -p hyperdu -p hyperdu-gui --locked -- --nocapture
      - name: Verify registry packages without publishing
        run: |
          cargo package --workspace --locked
          version="$(cargo pkgid -p hyperdu | sed 's/.*[#@]//')"
          python3 scripts/package/prepare_registry.py --version "$version"
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # The owned NTFS fixture is remounted read-only for both backend checks.
  # The second phase adds a cross-parent hardlink and verifies safe fallback.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - name: Installer argument regression (offline mocks)
        run: pwsh -File scripts/package/test_setup_hyperdu.ps1
      - uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test core, CLI and GUI on a fixed NTFS volume
        run: .\scripts\dev\ntfs_fixture.ps1
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # Binary/installer publication remains tag-only in release.yml.
