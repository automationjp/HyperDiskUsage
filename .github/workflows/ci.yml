name: ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      product_benchmark:
        description: 'Run HyperDU versus GNU du on hosted Linux (three million-file trees)'
        required: false
        type: boolean
        default: false
  # Only main is watched on push. A branch with an open PR ran the whole matrix
  # twice per commit -- once for the push, once for the pull_request -- for two
  # identical results.
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
env:
  # This workflow only asks whether the workspace compiles and passes tests; the
  # binaries it produces are discarded, and release.yml rebuilds them from
  # scratch on a tag. `lto = "thin"` with `codegen-units = 1` exists for those
  # shipped binaries and bought nothing here but link time, so the release
  # profile is relaxed for CI only. opt-level and panic=abort stay as declared,
  # which is what a release-profile build is here to check.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  # Not optional with sccache: incremental output is per-workspace state that
  # sccache cannot key on, so it silently disables caching for those crates.
  # Nothing is lost -- incremental artifacts never survive a runner anyway.
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  test-linux:
    if: github.event_name != 'workflow_dispatch' || !inputs.product_benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      # The 506 crates in Cargo.lock were compiled from zero on every single
      # run. sccache keys on the compiler invocation, so bumping one dependency
      # no longer invalidates the other 505 -- which is what a whole-target
      # cache keyed on Cargo.lock does.
      - uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
      # Registry and git checkouts only. Caching target/ as well would just
      # shadow sccache with a coarser copy of the same artifacts.
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-targets: "false"
      - name: Lint (fmt + clippy)
        run: bash scripts/lint/run.sh
      - name: Shellcheck scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml xfsprogs
          shellcheck -S error -x scripts/**/*.sh
      - name: Benchmark contract tests
        run: python3 -m unittest discover -s scripts/bench -p "test_*.py"
      - name: Supply-chain regression tests (offline mocks)
        run: python3 scripts/package/test_supply_chain.py
      - name: Import sort (nightly strict)
        run: |
          rustup toolchain install nightly -c rustfmt
          cargo +nightly fmt --all -- --check --config group_imports=StdExternalCrate --config imports_granularity=Crate
      - name: Build
        run: cargo build --workspace --release
      - name: Test core, CLI and GUI
        run: cargo test -p hyperdu-core -p hyperdu -p hyperdu-gui -- --nocapture
      - name: Linux asynchronous metadata configuration
        run: |
          cargo clippy --locked -p hyperdu-core -p hyperdu --all-targets --features linux-io-uring -- -D warnings
          cargo test --locked -p hyperdu-core -p hyperdu --features linux-io-uring -- --nocapture
      - name: Optional SIMD configuration
        run: |
          cargo clippy --locked -p hyperdu-core --all-targets --features simd-avx512 -- -D warnings
          cargo test --locked -p hyperdu-core --features simd-avx512 simd:: --lib -- --nocapture
      - name: Owned read-only XFS fixture
        run: |
          cargo test --locked -p hyperdu-core --features linux-io-uring --lib --test linux_acceleration --no-run --message-format=json > "$RUNNER_TEMP/linux-test-binaries.jsonl"
          core_test=$(python3 -c 'import json,sys; a=[json.loads(s) for s in open(sys.argv[1])]; print(next(x["executable"] for x in a if x.get("executable") and x["target"]["name"]=="hyperdu_core"))' "$RUNNER_TEMP/linux-test-binaries.jsonl")
          scan_test=$(python3 -c 'import json,sys; a=[json.loads(s) for s in open(sys.argv[1])]; print(next(x["executable"] for x in a if x.get("executable") and x["target"]["name"]=="linux_acceleration"))' "$RUNNER_TEMP/linux-test-binaries.jsonl")
          sudo bash scripts/dev/xfs_fixture.sh "$core_test" "$scan_test"
          sudo env HYPERDU_TEST_FANOTIFY_ROOT="$RUNNER_TEMP" "$core_test" index::journal::linux::tests --nocapture
          sudo env HYPERDU_INDEX_LINUX_BACKEND=fanotify "$core_test" index::v2::watch::tests::native_service --nocapture
          HYPERDU_INDEX_LINUX_BACKEND=inotify "$core_test" index::v2::watch::tests::native_service --nocapture
      # A silent drop to 0% would look exactly like the slow CI this replaced.
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # Native enumeration and MFT I/O need Windows. A fresh, owned NTFS VHDX is
  # populated and remounted read-only; parity must use MFT, never its fallback.
  test-windows:
    if: github.event_name != 'workflow_dispatch' || !inputs.product_benchmark
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - name: Benchmark contract tests
        run: python -m unittest discover -s scripts/bench -p "test_*.py"
      - name: Installer argument regression (offline mocks)
        run: pwsh -File scripts/package/test_setup_hyperdu.ps1
      - uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
      # No rust-cache here, unlike test-linux. Restoring it cost 25s on this
      # runner against 3s on Linux -- Windows unpacks the same registry far more
      # slowly -- while sccache was already serving 72% of the compilations that
      # cache exists to avoid. It is why this job, not test-linux, ended up on
      # the critical path.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Optional SIMD configuration
        run: |
          cargo clippy --locked -p hyperdu-core --all-targets --features simd-avx512 -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p hyperdu-core --features simd-avx512 simd:: --lib -- --nocapture
      - name: Test core, CLI and GUI on a fixed NTFS volume
        run: .\scripts\dev\ntfs_fixture.ps1
      # A silent drop to 0% would look exactly like the slow CI this replaced.
      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Retain native MFT measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-mft-measurements
          path: |
            ${{ runner.temp }}/hyperdu-mft-build.json
            ${{ runner.temp }}/hyperdu-mft-scalar.log
            ${{ runner.temp }}/hyperdu-mft-auto.log
          if-no-files-found: warn
          retention-days: 14

  # Exercise both native architectures: cross-checking cannot validate the
  # Darwin packed-attribute ABI, hardlink identity or allocation accounting.
  test-macos:
    if: github.event_name != 'workflow_dispatch' || !inputs.product_benchmark
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-targets: "false"
      - name: Record native environment
        run: |
          git rev-parse HEAD
          sw_vers
          uname -m
          rustc -Vv
          device=$(df -P "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $1 }')
          test -n "$device"
          diskutil info "$device"
      - name: Benchmark contract tests
        run: python3 -m unittest discover -s scripts/bench -p "test_*.py"
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test native metadata and application behavior
        run: cargo test --workspace -- --nocapture
      - name: Test parallel configuration
        run: cargo test --workspace --features hyperdu-core/rayon-par,hyperdu-core/rayon-inner,hyperdu-core/simd-prefetch
      - name: Build
        run: cargo build --workspace --release
      - name: Compare bulk metadata with the native fallback
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          binary = pathlib.Path("target/release/hyperdu")
          record = {
              "head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "build_command": "cargo build --workspace --release",
              "rustc": subprocess.check_output(["rustc", "-Vv"], text=True),
              "lto": os.environ["CARGO_PROFILE_RELEASE_LTO"],
              "codegen_units": os.environ["CARGO_PROFILE_RELEASE_CODEGEN_UNITS"],
          }
          pathlib.Path(os.environ["RUNNER_TEMP"], "hyperdu-build.json").write_text(json.dumps(record))
          PY
          python3 scripts/bench/remeasure.py \
            --bin target/release/hyperdu --commit "$(git rev-parse HEAD)" \
            --build-record "$RUNNER_TEMP/hyperdu-build.json" \
            --baseline-build-record "$RUNNER_TEMP/hyperdu-build.json" \
            --baseline-env '{"HYPERDU_MAC_USE_GALB":"0"}' \
            --dataset-parent "$RUNNER_TEMP/hyperdu-corpus" \
            --output "$RUNNER_TEMP/hyperdu-macos.json" \
            --entries 25000 --shape flat --shape deep --runs 4 \
            --environment-label "GitHub hosted $RUNNER_OS $RUNNER_ARCH" --syscalls off
      - name: Retain native measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-measurements-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/hyperdu-macos.json
            ${{ runner.temp }}/hyperdu-build.json
          if-no-files-found: warn
          retention-days: 14
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # Note: artifact packaging is handled in release.yml on tags. CI only builds and tests.

  # Product comparison runs alone on the public hosted runner; ordinary CI is unchanged.
  benchmark-du:
    if: github.event_name == 'workflow_dispatch' && inputs.product_benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Restore the shipped release profile instead of the faster CI-only profile.
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_DEBUG: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-targets: "false"
      - name: Validate comparison contract and GNU du accounting
        run: |
          python3 -m unittest discover -s scripts/bench -p "test_*.py"
          cargo test --locked -p hyperdu --test du_parity_linux
      - name: Build the portable production release
        run: cargo build --locked --release -p hyperdu
      - name: Compare HyperDU with GNU du on three million-file trees
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import shutil
          import subprocess
          import sys
          import time

          sys.path.insert(0, "scripts/bench")
          from remeasure import make_tree

          workspace = Path.cwd().resolve()
          task_root = Path(os.environ["RUNNER_TEMP"]) / "hyperdu-product-benchmark"
          task_root.mkdir(exist_ok=False)
          records = task_root / "records"
          records.mkdir()
          binaries = task_root / "bin"
          binaries.mkdir()
          corpora = task_root / "corpora"
          corpora.mkdir()

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def save(name, value):
              path = records / name
              with path.open("x", encoding="utf-8") as stream:
                  json.dump(value, stream, indent=2)
                  stream.write("\n")
              return path

          head = command("git", "rev-parse", "HEAD")
          if head != os.environ["GITHUB_SHA"] or command("git", "status", "--porcelain"):
              raise RuntimeError("Benchmark requires the exact clean workflow commit")
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          snapshot = save("source-snapshot.json", {
              "head": head,
              "tree": command("git", "rev-parse", "HEAD^{tree}"),
              "cargo_lock_sha256": sha(workspace / "Cargo.lock"),
              "files": {name: sha(workspace / name) for name in tracked if name},
          })
          binary = binaries / "hyperdu"
          shutil.copy2(workspace / "target/release/hyperdu", binary)
          build = save("build.json", {
              "head": head,
              "binary_sha256": sha(binary),
              "source_snapshot_sha256": sha(snapshot),
              "build_command": "cargo build --locked --release -p hyperdu",
              "rustc_version": command("rustc", "-Vv"),
              "profile": {"opt_level": 3, "lto": "thin", "codegen_units": 1,
                          "debug": True, "strip": True, "panic": "abort", "incremental": False},
              "features": "default",
              "rustflags": os.environ.get("RUSTFLAGS", ""),
              "cargo_encoded_rustflags": os.environ.get("CARGO_ENCODED_RUSTFLAGS", ""),
          })
          if os.environ.get("RUSTFLAGS") or os.environ.get("CARGO_ENCODED_RUSTFLAGS"):
              raise RuntimeError("Portable benchmark must not inherit custom compiler flags")
          du = Path("/usr/bin/du")
          du_record = save("du.json", {
              "binary_sha256": sha(du),
              "version": command(str(du), "--version").splitlines()[0],
              "package": command("dpkg-query", "-W", "coreutils"),
          })
          environment = {
              "provider": "GitHub Actions", "head": head,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"],
              "run_url": ("https://github.com/" + os.environ["GITHUB_REPOSITORY"]
                          + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]),
              "runner_environment": os.environ["RUNNER_ENVIRONMENT"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "image_os": os.environ.get("ImageOS"),
              "image_version": os.environ.get("ImageVersion"),
              "kernel": platform.platform(),
              "cpu": command("lscpu", "--json"),
              "memory": Path("/proc/meminfo").read_text(),
              "filesystem": command("findmnt", "--json", "--target", str(corpora)),
              "block_devices": command("lsblk", "--json", "--output", "NAME,TYPE,SIZE,ROTA,MODEL"),
              "cpu_count": os.cpu_count(),
              "comparison_settings": "default balanced I/O, automatic threads/filesystem selection",
              "cache": "warm after full parity scan; no cache reset",
          }
          github_record = save("github.json", environment)
          summaries = []
          for shape in ("flat", "wide", "deep"):
              available = os.statvfs(corpora)
              if available.f_bavail * available.f_frsize < 6 * 1024**3 or available.f_favail < 1_100_000:
                  raise RuntimeError("Require 6 GiB and 1.1 million free inodes for each owned corpus")
              print(f"Generating {shape}: 1,000,000 files of 256 bytes", flush=True)
              root = make_tree(corpora, shape, 1_000_000, 16, 256)
              save(f"corpus-{shape}.json", {
                  "shape": shape, "files": 1_000_000, "file_size": 256, "depth": 16,
                  "root": str(root), "generator": "scripts/bench/remeasure.py:make_tree",
              })
              os.sync()
              result_path = records / f"{shape}.json"
              args = [sys.executable, "scripts/bench/du_same_conditions.py",
                      "--environment", "github-actions", "--github-record", str(github_record),
                      "--binary", str(binary), "--root", str(root), "--scope", "directory",
                      "--output", str(result_path), "--build-record", str(build),
                      "--source-snapshot", str(snapshot), "--expected-head", head,
                      "--du", str(du), "--du-record", str(du_record),
                      "--phase", "measurement", "--runs", "8", "--timeout", "300"]
              save(f"command-{shape}.json", args)
              started = time.monotonic()
              with (records / f"{shape}.log").open("x", encoding="utf-8") as log:
                  subprocess.run(args, stdout=log, stderr=subprocess.STDOUT, check=True)
              result = json.loads(result_path.read_text())
              if not result.get("complete"):
                  raise RuntimeError(f"Incomplete measurement: {shape}")
              summaries.append({"shape": shape, "result": result_path.name,
                                "sha256": sha(result_path), "elapsed_seconds": time.monotonic() - started})
              print(f"Accepted {shape}: {result.get('median_ms')}", flush=True)
              resolved = root.resolve(strict=True)
              if root.is_symlink() or resolved.parent != corpora.resolve() or not resolved.name.startswith(f"hyperdu-{shape}-"):
                  raise RuntimeError("Refuse cleanup outside the owned corpus")
              shutil.rmtree(resolved)
          save("complete.json", {"complete": True, "head": head, "results": summaries})
          PY
      - name: Retain all measurements and provenance, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hyperdu-gnu-du-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hyperdu-product-benchmark/records/
          if-no-files-found: warn
          retention-days: 90
