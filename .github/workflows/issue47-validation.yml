name: issue47-validation
on:
  push:
    branches: [codex/issue47-validation]
    paths: [.github/workflows/issue47-validation.yml]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: 6c4bfa1f78658917c8f8089c499d8e4d4fa346ca
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Apply candidate
        run: python ../transport/.github/apply-candidate.py
      - name: Format and source snapshot
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          cargo +nightly fmt --all -- --config group_imports=StdExternalCrate --config imports_granularity=Crate
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/candidate.patch"
          tar --exclude=.git --exclude=target -czf "$RUNNER_TEMP/candidate-source.tar.gz" .
      - name: Core and CLI regressions
        run: cargo test -p hyperdu-core -p hyperdu-cli --locked 2>&1 | tee "$RUNNER_TEMP/core-cli.log"
      - name: Workspace all features
        run: cargo test --workspace --all-features --locked 2>&1 | tee "$RUNNER_TEMP/all-features.log"
      - name: Clippy
        if: always()
        run: cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-candidate-evidence
          path: |
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/candidate-source.tar.gz
            ${{ runner.temp }}/core-cli.log
            ${{ runner.temp }}/all-features.log
            ${{ runner.temp }}/clippy.log
          retention-days: 1
  strict-ntfs:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: 6c4bfa1f78658917c8f8089c499d8e4d4fa346ca
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Apply candidate
        shell: pwsh
        run: |
          python ../transport/.github/apply-candidate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict real NTFS fixture
        shell: pwsh
        run: ./scripts/test-mft-fixture.ps1
      - name: Native core and CLI regressions
        shell: pwsh
        run: |
          cargo test -p hyperdu-core -p hyperdu-cli --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy -p hyperdu-core -p hyperdu-cli --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-ntfs-evidence
          path: |
            ${{ runner.temp }}/hyperdu-mft-cargo.log
            ${{ runner.temp }}/hyperdu-mft-fixture.json
          retention-days: 1
