name: source-import
# Temporary, single-PR import of a checksum-pinned maintenance patch.
# Removed after source publication; regular CI validates committed source.
on:
  pull_request:
    paths:
      - '.maintenance-input/**'
      - '.github/workflows/source-import.yml'
permissions:
  contents: read
concurrency:
  group: source-import-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event.pull_request.number == 83 && github.event.pull_request.head.repo.full_name == 'automationjp/HyperDiskUsage' && github.event.pull_request.head.ref == 'docs/released-beta5-and-ci-safety'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt
      - name: Apply checksum-pinned source change without credentials
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, zlib
          from pathlib import Path
          encoded = ''.join(Path(f'.maintenance-input/part-{i}.b64').read_text() for i in range(4))
          if len(encoded) > 100000:
              raise ValueError('oversized patch encoding')
          decoder = zlib.decompressobj()
          patch = decoder.decompress(base64.b64decode(encoded, validate=True), 2 * 1024 * 1024)
          if not decoder.eof or decoder.unused_data or decoder.unconsumed_tail:
              raise ValueError('invalid compressed patch')
          if hashlib.sha256(patch).hexdigest() != '0d7fd4a8592d4909c1fef65569510ebd55eaeaf2d99f05f872cf3a166b1fc95d':
              raise ValueError('patch checksum mismatch')
          Path(os.environ['RUNNER_TEMP'], 'maintenance.patch').write_bytes(patch)
          PY
          git apply --check --index "$RUNNER_TEMP/maintenance.patch"
          git apply --index "$RUNNER_TEMP/maintenance.patch"
          cargo fmt --all
      - name: Prepare plain source data for the restricted publisher
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only', '-z']).decode().strip('\0').split('\0')
          changes = []
          for name in paths:
              path = Path(name)
              if not path.is_file() or path.is_symlink() or path.stat().st_size > 1024 * 1024:
                  raise ValueError('invalid source file')
              changes.append({'path': name, 'content': path.read_text()})
          data = {'parent': subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(), 'changes': changes}
          Path('import-output').mkdir()
          Path('import-output/changes.json').write_text(json.dumps(data, ensure_ascii=False))
          print('Prepared', len(changes), 'plain source files')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: source-import-data
          path: import-output/changes.json
          if-no-files-found: error
          retention-days: 3
  publish:
    if: github.event.pull_request.number == 83 && github.event.pull_request.head.repo.full_name == 'automationjp/HyperDiskUsage' && github.event.pull_request.head.ref == 'docs/released-beta5-and-ci-safety'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: source-import-data
          path: data
      - name: Commit allowlisted text data without executing repository code
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, stat
          from pathlib import Path
          from urllib.request import HTTPRedirectHandler, ProxyHandler, Request, build_opener
          allowed = set('''AGENTS.md
          README.en.md
          README.md
          README.zh-CN.md
          docs/architecture.md
          docs/developer-guide.md
          docs/en/architecture.md
          docs/en/setup.md
          docs/setup.md
          docs/zh-CN/architecture.md
          docs/zh-CN/setup.md
          hyperdu-core/Cargo.toml
          hyperdu-core/src/platform/windows_impl/mft_aggregate.rs
          hyperdu-core/src/platform/windows_impl/mft_reader.rs
          hyperdu-core/src/platform/windows_impl/mft_reader/aggregate_safety_tests.rs
          hyperdu-core/src/platform/windows_impl/mft_reader/namespace_tests.rs
          hyperdu-core/src/platform/windows_impl/mod.rs
          hyperdu-core/tests/mft_namespace_fallback.rs
          hyperdu-core/tests/mft_parity.rs
          hyperdu-core/tests/mft_portable.rs
          hyperdu-gui/Cargo.toml
          hyperdu-gui/README.en.md
          hyperdu-gui/README.md
          hyperdu-gui/README.zh-CN.md
          hyperdu-gui/src/app.rs
          hyperdu-gui/src/app/export.rs
          hyperdu-gui/src/scan.rs
          scripts/dev/ntfs_fixture.ps1'''.splitlines())
          file = Path('data/changes.json')
          if not stat.S_ISREG(file.lstat().st_mode) or file.stat().st_size > 4 * 1024 * 1024:
              raise ValueError('invalid data file')
          data = json.loads(file.read_text())
          parent = os.environ['EXPECTED_PARENT']
          if not re.fullmatch('[0-9a-f]{40}', parent) or data['parent'] != parent:
              raise ValueError('source parent mismatch')
          changes = data['changes']
          if len(changes) != len(allowed) or {row['path'] for row in changes} != allowed:
              raise ValueError('source path set mismatch')
          for row in changes:
              if not isinstance(row['content'], str) or len(row['content'].encode()) > 1024 * 1024:
                  raise ValueError('invalid text payload')
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args):
                  raise ValueError('redirect rejected')
          opener = build_opener(ProxyHandler({}), NoRedirect())
          def api(method, suffix, value=None):
              url = 'https://api.github.com/repos/automationjp/HyperDiskUsage/' + suffix
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                         'Accept': 'application/vnd.github+json', 'User-Agent': 'hyperdu-maintenance',
                         'Content-Type': 'application/json'}
              body = None if value is None else json.dumps(value).encode()
              with opener.open(Request(url, data=body, headers=headers, method=method), timeout=30) as response:
                  return json.load(response)
          branch = 'heads/docs/released-beta5-and-ci-safety'
          if api('GET', 'git/ref/' + branch)['object']['sha'] != parent:
              raise ValueError('branch advanced; refusing overwrite')
          base = api('GET', 'git/commits/' + parent)['tree']['sha']
          tree = []
          for row in changes:
              blob = api('POST', 'git/blobs', {'content': row['content'], 'encoding': 'utf-8'})['sha']
              tree.append({'path': row['path'], 'mode': '100644', 'type': 'blob', 'sha': blob})
          result = api('POST', 'git/trees', {'base_tree': base, 'tree': tree})
          commit = api('POST', 'git/commits', {'tree': result['sha'], 'parents': [parent],
              'message': 'fix: export off the UI thread and reject incomplete MFT namespaces'})
          api('PATCH', 'git/refs/' + branch, {'sha': commit['sha'], 'force': False})
          print('Committed validated text data:', commit['sha'])
          PY
