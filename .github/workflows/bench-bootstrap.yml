# Temporary, branch-bound bootstrap. Removed after accepting tested formatting/lock.
name: bench-bootstrap
on:
  pull_request:
    paths:
      - '.github/workflows/bench-bootstrap.yml'
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.number == 95 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/logmosaic-benchmark-profiler'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Apply reviewed fixes in the unprivileged build job
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bench/hyperdu-bench')
          def edit(name, old, new):
              f = p / name
              text = f.read_text()
              assert old in text, (name, old)
              f.write_text(text.replace(old, new))
          edit('src/lib.rs', 'pub mod clock;', 'pub mod analysis;\npub mod clock;')
          edit('src/lib.rs', '    pub fn new(clock:', '    // The canonical record explicitly names each correlation field.\n    #[allow(clippy::too_many_arguments)]\n    pub fn new(clock:')
          edit('src/clock.rs', 'return Ok(u64::try_from(ts.tv_sec)? * 1_000_000_000 + u64::try_from(ts.tv_nsec)?);', 'Ok(u64::try_from(ts.tv_sec)? * 1_000_000_000 + u64::try_from(ts.tv_nsec)?)')
          edit('src/clock.rs', 'return Ok(((count as u128 * 1_000_000_000) / freq as u128).try_into()?);', 'Ok(((count as u128 * 1_000_000_000) / freq as u128).try_into()?)')
          edit('src/process.rs', 'use std::fs;', '#[cfg(target_os = "linux")]\nuse std::fs;')
          edit('src/main.rs', 'use std::fs::{self, File};', 'use std::fs;')
          edit('src/main.rs', 'runs>=4 && runs<=1000 && runs%2==0', '(4..=1000).contains(&runs) && runs.is_multiple_of(2)')
          edit('src/main.rs', '    create_private(&out.join("go"))?;\n    let released = mono_ns()?;', '    let released = mono_ns()?;\n    create_private(&out.join("go"))?;')
          edit('src/main.rs', '    ensure!(driver_result["pid"]==target_pid,"driver identity changed");', '    ensure!(driver_result["pid"]==target_pid,"driver identity changed");\n    ensure!(driver_result["telemetry_dropped"]==0,"internal telemetry was dropped; refusing complete diagnosis");')
          edit('src/main.rs', '    let delivery = logmosaic::ingest(&agent,out,Duration::from_secs(t.timeout_secs))?;', '    let delivery = logmosaic::ingest(&agent,out,Duration::from_secs(t.timeout_secs))?;\n    let analysis = hyperdu_bench::analysis::generate(out)?;')
          edit('src/main.rs', '"logmosaic":delivery,', '"logmosaic":delivery,"analysis":analysis,')
          edit('src/main.rs', '        let now = mono_ns()?;\n        match process::snapshot(target_pid)', '        ensure!(fs::metadata(out.join("perf.data")).map_or(true,|m|m.len() <= hyperdu_bench::MAX_JSON_BYTES),"perf artifact quota exceeded");\n        let now = mono_ns()?;\n        match process::snapshot(target_pid)')
          edit('src/perf.rs', 'use anyhow::{ensure, Context, Result};', 'use anyhow::{ensure, Result};')
          edit('src/perf.rs', '            if event == "cpu-clock" { c.args(["-F","99","-e",event]); }\n            else { c.args(["-c","1","-e",event]); }', '            let configured = if event == "cpu-clock" { "cpu-clock/freq=99/".to_string() } else { format!("{event}/period=1/") };\n            c.arg("-e").arg(configured);')
          edit('src/perf.rs', '        let text = dir.join("perf-script.txt");', '        ensure!(fs::metadata(dir.join("perf.data"))?.len() <= MAX_JSON_BYTES,"perf artifact quota exceeded");\n        let text = dir.join("perf-script.txt");')
          edit('src/bin/driver.rs', 'bytes + line.len() as u64 + 1 <= MAX_JSON_BYTES', 'bytes + (line.len() as u64) < MAX_JSON_BYTES')
          edit('src/bin/driver.rs', '    COUNT.store(sink.is_some(),Ordering::Relaxed);', '    if let Some(s) = &sink {\n        if let Ok(mut attrs) = hyperdu_bench::process::snapshot(std::process::id()) {\n            attrs["profile.category"] = json!("process");\n            s.emit("process.scan_start",mono_ns()?,attrs);\n        }\n    }\n    COUNT.store(sink.is_some(),Ordering::Relaxed);')
          edit('src/bin/driver.rs', '    COUNT.store(false,Ordering::Relaxed);', '    COUNT.store(false,Ordering::Relaxed);\n    if let Some(s) = &sink {\n        if let Ok(mut attrs) = hyperdu_bench::process::snapshot(std::process::id()) {\n            attrs["profile.category"] = json!("process");\n            s.emit("process.scan_end",mono_ns()?,attrs);\n        }\n    }')
          edit('src/logmosaic.rs', '        events.push(serde_json::from_str(&line?)?);', '        let event: Event = serde_json::from_str(&line?)?;\n        ensure!(event.attributes.is_object() && event.resource.is_object(),"event attributes/resource must be objects");\n        events.push(event);')
          edit('src/analysis.rs', ".replace(['\\r','\\n'],' ')", ".replace(['\\r','\\n'],\" \")")
          # Permanently test that global perf frequency/period flags cannot collide.
          f = p / 'src/perf.rs'
          f.write_text(f.read_text() + '''\n#[cfg(test)]\nmod command_tests {\n    use super::*;\n    #[test]\n    fn sampling_periods_are_per_event() {\n        let p = Perf { binary: "perf".into(), events: vec!["cpu-clock".into(),"raw_syscalls:sys_enter".into()], capability: json!({}) };\n        let c = p.command(Path::new("driver"),Path::new("out"));\n        let args: Vec<_> = c.get_args().map(|s|s.to_string_lossy().into_owned()).collect();\n        assert!(args.contains(&"cpu-clock/freq=99/".into()));\n        assert!(args.contains(&"raw_syscalls:sys_enter/period=1/".into()));\n        assert!(!args.contains(&"-F".into()));\n        assert!(!args.contains(&"-c".into()));\n    }\n}\n''')
          PY
          cargo generate-lockfile --manifest-path bench/hyperdu-bench/Cargo.toml
          cargo fmt --manifest-path bench/hyperdu-bench/Cargo.toml
          cargo test --locked --manifest-path bench/hyperdu-bench/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path bench/hyperdu-bench/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path bench/hyperdu-bench/Cargo.toml --check
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('bench/hyperdu-bench')
          files = sorted(root.glob('src/**/*.rs')) + sorted(root.glob('tests/*.rs')) + [root/'Cargo.lock']
          Path('payload').mkdir()
          data = {'base':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'files':{p.as_posix():p.read_text() for p in files}}
          Path('payload/edits.json').write_text(json.dumps(data))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bench-bootstrap-tested-edits
          path: payload/edits.json
          if-no-files-found: error
          retention-days: 3
  accept-generated:
    needs: prepare
    if: github.event.pull_request.number == 95 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/logmosaic-benchmark-profiler'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No repository checkout, compilation, or execution of artifact content here.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bench-bootstrap-tested-edits
          path: payload
      - name: Commit data-only allowlisted edits to this PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          expected = os.environ['EXPECTED_HEAD']
          assert re.fullmatch('[0-9a-f]{40}',expected)
          p = Path('payload/edits.json')
          assert p.stat().st_size < 2_000_000
          data = json.loads(p.read_text())
          assert data['base'] == expected
          names = {'src/analysis.rs','src/lib.rs','src/clock.rs','src/dataset.rs','src/logmosaic.rs','src/perf.rs','src/process.rs','src/main.rs','src/bin/driver.rs','tests/e2e.rs','Cargo.lock'}
          allowed = {'bench/hyperdu-bench/'+n for n in names}
          assert set(data['files']) == allowed
          for name,content in data['files'].items():
              assert isinstance(content,str) and 0 < len(content.encode()) < 300_000 and '\x00' not in content
          base_url = 'https://api.github.com/repos/automationjp/HyperDiskUsage/'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener = urllib.request.build_opener(NoRedirect)
          def api(path, method='GET', value=None):
              req = urllib.request.Request(base_url+path,data=None if value is None else json.dumps(value).encode(),method=method,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with opener.open(req,timeout=30) as r: return json.load(r)
          ref = 'git/refs/heads/feat/logmosaic-benchmark-profiler'
          assert api(ref)['object']['sha'] == expected, 'branch advanced; reconcile instead of overwriting'
          parent = api('git/commits/'+expected)
          tree = api('git/trees','POST',{'base_tree':parent['tree']['sha'],'tree':[
              {'path':n,'mode':'100644','type':'blob','content':c} for n,c in data['files'].items()]})
          commit = api('git/commits','POST',{'message':'fix: validate concurrent diagnostics, normalize reports and pin tested dependencies','tree':tree['sha'],'parents':[expected]})
          api(ref,'PATCH',{'sha':commit['sha'],'force':False})
          print('Accepted tested commit:',commit['sha'])
          PY
