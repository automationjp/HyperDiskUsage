name: mft-workbench
on:
  push:
    branches: [codex/mft-verified-parity]
permissions:
  contents: write
jobs:
  regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply and format regression changes
        run: |
          git apply --check .github/mft-changes.patch
          git apply .github/mft-changes.patch
          rustup toolchain install nightly --profile minimal --component rustfmt
          cargo +nightly fmt --all -- --config group_imports=StdExternalCrate --config imports_granularity=Crate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hyperdu-core hyperdu-cli scripts docs
          git commit -m 'test: reproduce sparse stream edge cases'
          git push origin HEAD:refs/heads/codex/mft-verified-parity
      - name: Portable MFT tests
        run: cargo test -p hyperdu-core --test mft_portable -- --nocapture 2>&1 | tee regressions.log
      - name: Source snapshot
        if: always()
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mft-regressions-${{ github.run_id }}
          path: |
            source.tar
            regressions.log
          retention-days: 1
