name: mft-workbench
on:
  push:
    branches: [codex/mft-verified-parity]
    paths: [.github/workflows/mft-workbench.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8ba1c12401725c74a3909c996b641f8530dcafa0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Workspace tests with parallel features
        run: cargo test --workspace --features hyperdu-core/rayon-par,hyperdu-core/rayon-inner,hyperdu-core/simd-prefetch -- --nocapture 2>&1 | tee tests.log
      - name: Clippy
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: Separate profiler configurations
        if: always()
        run: |
          cargo check --workspace --features hyperdu-core/prof-tracy 2>&1 | tee tracy.log
          cargo check --workspace --features hyperdu-core/prof-puffin 2>&1 | tee puffin.log
      - name: Verify baseline all-feature conflict
        if: always()
        run: |
          git fetch --depth=1 origin 983bb01b8d6cae6d53eff47705438e2504477e68
          git worktree add --detach "$RUNNER_TEMP/hyperdu-baseline" FETCH_HEAD
          set +e
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo check --manifest-path "$RUNNER_TEMP/hyperdu-baseline/Cargo.toml" --workspace --all-features > baseline-all-features.log 2>&1
          code=$?
          set -e
          cat baseline-all-features.log
          test "$code" -ne 0
          grep -q 'defined multiple times' baseline-all-features.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-verification-${{ github.run_id }}
          path: '*.log'
          retention-days: 1
  ntfs-fixture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8ba1c12401725c74a3909c996b641f8530dcafa0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Fixed NTFS volume tests
        run: pwsh -NoProfile -File scripts/test-ntfs-fixture.ps1 2>&1 | tee ntfs-fixture.log
      - name: Live read-only MFT probe
        if: always()
        run: cargo test -p hyperdu-core --test mft_probe actual_mft_is_complete -- --ignored --nocapture 2>&1 | tee live-probe.log
      - name: Native Windows Clippy
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee windows-clippy.log
      - name: Source snapshot
        if: always()
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ntfs-fixture-${{ github.run_id }}
          path: |
            source.tar
            ntfs-fixture.log
            live-probe.log
            windows-clippy.log
          retention-days: 1
