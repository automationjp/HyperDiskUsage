name: pages

# Build the public site from site/, not the developer documents in docs/.
# Documentation-only changes also run the offline contracts and preview build.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README*.md'
      - 'hyperdu/README*.md'
      - 'hyperdu-gui/README*.md'
      - 'docs/**'
      - 'bucket/hyperdu.json'
      - 'scripts/lint/test_docs.py'
      - 'scripts/lint/versions.sh'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'README*.md'
      - 'hyperdu/README*.md'
      - 'hyperdu-gui/README*.md'
      - 'docs/**'
      - 'bucket/hyperdu.json'
      - 'scripts/lint/test_docs.py'
      - 'scripts/lint/versions.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a production deployment that has already started.
concurrency:
  group: pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check documentation contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 scripts/lint/test_docs.py
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./site
          destination: ./_site
      - name: Verify the rendered three-language site
        run: python3 scripts/lint/test_docs.py --rendered _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4

  deploy:
    # Preview builds never receive the Pages publication job.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
