name: pages

# Build the public site from site/, not the developer documents in docs/.
# Documentation-only changes also run the offline contracts and preview build.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README*.md'
      - 'hyperdu/README*.md'
      - 'hyperdu-gui/README*.md'
      - 'docs/**'
      - 'bucket/hyperdu.json'
      - 'scripts/lint/test_docs.py'
      - 'scripts/lint/versions.sh'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'README*.md'
      - 'hyperdu/README*.md'
      - 'hyperdu-gui/README*.md'
      - 'docs/**'
      - 'bucket/hyperdu.json'
      - 'scripts/lint/test_docs.py'
      - 'scripts/lint/versions.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a production deployment that has already started.
concurrency:
  group: pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check documentation contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 scripts/lint/test_docs.py
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: false
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./site
          destination: ./_site
      - name: Verify the rendered three-language site
        run: python3 scripts/lint/test_docs.py --rendered _site
      # upload-pages-artifact v4 embeds upload-artifact v4 (Node 20).
      # Preserve its Pages tar contract, using the Node 24 uploader directly.
      - name: Archive Pages artifact
        run: |
          tar --dereference --hard-dereference --directory _site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github --exclude=".[^/]*" .
      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    # Preview builds never receive the Pages publication job.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
