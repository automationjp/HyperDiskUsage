# cargo-deny configuration
#
# Schema: cargo-deny 0.16 or newer. The keys this file used before
# (`vulnerability`, `unsound`, `notice`, `unlicensed`, `copyleft`) were removed
# upstream, which made the whole file fail to deserialize, so `cargo deny check`
# could not run at all. Security advisories and unlicensed crates are now always
# denied, so only the still-configurable knobs remain here.

[advisories]
# Report unmaintained crates anywhere in the graph, not just direct dependencies.
unmaintained = "all"
yanked = "warn"
# The remaining GUI font-parser notice is unmaintained, not a known vulnerability.
# egui 0.32 -> epaint -> ab_glyph -> owned_ttf_parser still requires this crate.
# No patched ttf-parser release exists. Reassess when upgrading the GUI stack;
# replacing that stack is a separate compatibility change, not an ignored DoS.
ignore = [
  "RUSTSEC-2026-0192", # ttf-parser 0.25.1; review date 2026-09-10
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = []

[licenses]
# Anything not listed here fails the check. The old `default = "allow"` has no
# equivalent in the current schema, so this enumerates the licences actually
# present in the dependency graph; a newly introduced licence now shows up as a
# failure to review rather than passing silently.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "OFL-1.1",         # epaint default fonts (GUI only)
  "Ubuntu-font-1.0", # epaint default fonts (GUI only)
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
  # Weak copyleft, build-time only: r-efi, pulled in through wasi.
  "LGPL-2.1-or-later",
]
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
]
allow-git = []
