[package]
name = "hyperdu-gui"
version.workspace = true
edition.workspace = true
description = "Hyper-fast GUI disk usage analyzer (Windows/Linux)."
license.workspace = true
rust-version = "1.75"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["disk-usage", "du", "filesystem", "gui", "visualization"]
categories = ["gui", "filesystem"]

[features]
default = []
# Forward the core allocator feature when building GUI
mimalloc = ["hyperdu-core/mimalloc"]
debug-eyre = ["dep:color-eyre"]
prof-tracy = ["dep:profiling", "hyperdu-core/prof-tracy"]
 

[dependencies]
anyhow = "1.0"
humansize = "2.1"
egui = "0.32"
# Prefer the OpenGL/GLFW (glow) backend by default for broader Cross builds.
# WGPU can be enabled later if needed via a feature, but default to glow-only
# to reduce platform toolchain deps and build flakes.
eframe = { version = "0.32", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
egui_extras = "0.32"
rfd = "0.15"
log = "0.4"
env_logger = "0.11"
hyperdu-core = { workspace = true }
profiling = { version = "1", optional = true }
color-eyre = { version = "0.6", optional = true }

[dev-dependencies]
tempfile = "3.10"

# Debian packaging (cargo-deb)
[package.metadata.deb]
section = "utils"
priority = "optional"
depends = "$auto"
maintainer = "HyperDU Maintainers <maintainers@example.com>"
extended-description = "Hyper-fast disk usage analyzer GUI."
# An explicit assets list turns OFF cargo-deb's automatic binary inclusion, so the
# executable has to be listed here too. Without this line the .deb shipped the
# README and the licence and no `hyperdu-gui` command at all -- 7480 bytes of
# documentation, published as v0.5.0-beta.2. hyperdu-cli hit this and was fixed;
# this manifest was not. Same source path as [package.metadata.generate-rpm]
# below, for the same reason.
#
# The docs land under the package's own name rather than a shared /usr/share/doc/hyperdu/.
# dpkg refuses to unpack a file another package already owns, so sharing that
# directory with hyperdu-cli made the two .deb files mutually exclusive. It never
# surfaced only because this package shipped no binary and nobody installed it.
assets = [
  ["../target/release/hyperdu-gui", "/usr/bin/hyperdu-gui", "755"],
  ["../README.md", "/usr/share/doc/hyperdu-gui/README.md", "644"],
  ["../LICENSE", "/usr/share/doc/hyperdu-gui/LICENSE", "644"],
]

# RPM packaging (cargo-generate-rpm)
[package.metadata.generate-rpm]
summary = "Hyper-fast disk usage analyzer GUI"
license = "MIT"
group = "Applications/System"
# cargo-generate-rpm expects a string policy here. `requires` is intentionally
# omitted: automatic library dependency discovery supplies the runtime deps.
auto-req = "auto"
assets = [
  { source = "../target/release/hyperdu-gui", dest = "/usr/bin/hyperdu-gui", mode = "755" },
  { source = "../README.md", dest = "/usr/share/doc/hyperdu-gui/README.md", mode = "644" },
  { source = "../LICENSE", dest = "/usr/share/doc/hyperdu-gui/LICENSE", mode = "644" },
]
