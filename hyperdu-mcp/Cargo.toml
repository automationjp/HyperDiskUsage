[package]
name = "hyperdu-mcp"
version = "0.5.0-beta.1"
edition = "2021"
license = "MIT"
description = "MCP server for HyperDU: exposes disk usage to agents as structured data"
# rmcp requires 1.88, above the 1.75 the rest of the workspace declares. CI builds
# on stable, so this only documents the floor for this crate.
rust-version = "1.88"
repository = "https://github.com/automationjp/HyperDiskUsage"
homepage = "https://github.com/automationjp/HyperDiskUsage#readme"
readme = "README.md"
keywords = ["mcp", "disk-usage", "agent", "filesystem", "llm"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
hyperdu-core = { path = "../hyperdu-core", version = "0.5.0-beta.1" }
rmcp = { version = "3.2", features = ["server", "macros", "transport-io"] }
# `rt-multi-thread` because a scan is dispatched to `spawn_blocking`; the current
# thread runtime would stall the protocol loop while it runs.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
