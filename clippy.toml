# Clippy configuration for the workspace.
# Note: lint levels are controlled via `cargo clippy` flags or crate attributes.

# Be tolerant with complex/long functions in low-level backends.
cognitive-complexity-threshold = 50
too-many-lines-threshold = 500
type-complexity-threshold = 500

# No `msrv` here on purpose. Clippy falls back to each package's own
# `rust-version`, which is what we want now that the crates no longer agree:
# core and gui declare 1.75, while hyperdu needs 1.88 for built-in MCP.
# Pinning one version workspace-wide would lint hyperdu against a floor it
# does not have, and clippy warns about the mismatch rather than picking one.
