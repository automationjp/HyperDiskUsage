# Jekyll configuration for the project site.
#
# The site lives in `site/` rather than `docs/` because `docs/` already holds
# design notes and benchmark records written for contributors, not visitors.
# Rendering those through a site theme would bury the pages people arrive for.

title: HyperDU
description: >-
  Fast cross-platform disk usage analyzer. Native metadata reads and parallel
  traversal, shared by the CLI, GUI, and read-only MCP tools.

# The custom domain in site/CNAME serves this at the root, so there is no
# /<repo>/ prefix to carry. `baseurl` has to stay empty for that: a leftover
# prefix is the usual reason a Pages site renders with no stylesheet, because
# every `relative_url` in _layouts/default.html would point one level too deep.
url: https://hyperdu.automation.jp
baseurl: ""

repository: automationjp/HyperDiskUsage
# `hyperdu`, not `hyperdu-cli`. The latter is the retired name.
published_cli_url: https://crates.io/crates/hyperdu

# Live source/documentation links, NOT the installation or measurement version.
# Installation uses versions below. Historical measurements keep their own
# commit in _data/benchmarks.json; never relabel them as a newer measurement.
source_revision: main

# The three language trees. The layout builds its switcher from this list, so
# adding a language here and a page under `site/<code>/` is all it takes.
languages:
  - code: ja
    label: 日本語
    path: /
  - code: en
    label: English
    path: /en/
  - code: zh-CN
    label: 简体中文
    path: /zh-CN/

# Published versions, shared by status labels and installation commands.
# Update only after the matching release assets and registry versions exist.
versions:
  cli: 0.5.0-beta.7
  gui: 0.5.0-beta.7

plugins: []

exclude:
  - README.md
