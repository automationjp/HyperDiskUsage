# Jekyll configuration for the project site.
#
# The site lives in `site/` rather than `docs/` because `docs/` already holds
# design notes and benchmark records written for contributors, not visitors.
# Rendering those through a site theme would bury the pages people arrive for.

title: HyperDU
description: >-
  Fast cross-platform disk usage analyzer. Finds what is filling a disk, and
  which build artifacts may be reclaimable.

# The custom domain in site/CNAME serves this at the root, so there is no
# /<repo>/ prefix to carry. `baseurl` has to stay empty for that: a leftover
# prefix is the usual reason a Pages site renders with no stylesheet, because
# every `relative_url` in _layouts/default.html would point one level too deep.
url: https://hyperdu.automation.jp
baseurl: ""

repository: automationjp/HyperDiskUsage
# `hyperdu`, not `hyperdu-cli`. The latter is the retired name and now carries
# nothing but a deprecation notice, so the footer link would send readers to a
# dead end.
published_cli_url: https://crates.io/crates/hyperdu

# This unreleased source snapshot is the version described and measured below.
source_revision: 2645689515ab2e608a78b7492637e55179e4739a

# The three language trees. The layout builds its switcher from this list, so
# adding a language here and a page under `site/<code>/` is all it takes.
languages:
  - code: ja
    label: 日本語
    path: /
  - code: en
    label: English
    path: /en/
  - code: zh-CN
    label: 简体中文
    path: /zh-CN/

# Version numbers appear in install commands on all pages. Keeping them here
# means a release updates one place instead of six.
versions:
  cli: 0.5.0-beta.5
  gui: 0.5.0-beta.5

# No theme: the site is one page per language, and a theme's layouts would be
# more to work around than to use.
plugins: []

exclude:
  - README.md
